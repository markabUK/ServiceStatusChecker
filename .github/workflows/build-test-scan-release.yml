name: Build, Test and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: get_version
        run: echo "VERSION=$(cat version.txt | xargs)" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore/Build/Test
        run: |
          dotnet restore ServiceStatusChecker.slnx
          dotnet build ServiceStatusChecker.slnx -c Release -p:Version=${{ steps.get_version.outputs.VERSION }}
          dotnet test ServiceStatusChecker.slnx -c Release --no-build

  # This job waits for your manual click in the GitHub UI
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create and Push Tag
        run: |
          VERSION=${{ needs.build.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v$VERSION
          git push origin v$VERSION

      # 1. Publish Windows Standalone Single File
      - name: Publish Windows (win-x64)
        run: >
          dotnet publish ServiceStatusChecker/ServiceStatusChecker.csproj 
          -c Release -r win-x64 --self-contained true 
          -p:PublishSingleFile=true -p:Version=${{ needs.build.outputs.version }}
          -o ./publish/win-x64

      # 2. Publish Linux Standalone Single File
      - name: Publish Linux (linux-x64)
        run: >
          dotnet publish ServiceStatusChecker/ServiceStatusChecker.csproj 
          -c Release -r linux-x64 --self-contained true 
          -p:PublishSingleFile=true -p:Version=${{ needs.build.outputs.version }}
          -o ./publish/linux-x64

      # 3. Archive Artifacts
      - name: Archive Builds
        run: |
          cd publish/win-x64 && zip -r ../../ServiceStatusChecker-win-x64.zip ./* && cd ../..
          cd publish/linux-x64 && tar -czvf ../../ServiceStatusChecker-linux-x64.tar.gz ./* && cd ../..

      # 4. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            ServiceStatusChecker-win-x64.zip
            ServiceStatusChecker-linux-x64.tar.gz
          generate_release_notes: true