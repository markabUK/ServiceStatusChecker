name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v (e.g., v1.0.0, v2.1.3)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      # 1. Publish Windows Standalone Single File
      - name: Publish Windows (win-x64)
        run: dotnet publish ServiceStatusChecker/ServiceStatusChecker.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./publish/win-x64
      
      # 2. Publish Linux Standalone Single File
      - name: Publish Linux (linux-x64)
        run: dotnet publish ServiceStatusChecker/ServiceStatusChecker.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o ./publish/linux-x64
      
      # 3. Zip the Windows build
      - name: Archive Windows Build
        run: |
          cd publish/win-x64
          zip -r ../../ServiceStatusChecker-win-x64.zip ./*
      
      # 4. Tar.gz the Linux build (standard for Linux binaries)
      - name: Archive Linux Build
        run: |
          cd publish/linux-x64
          tar -czvf ../../ServiceStatusChecker-linux-x64.tar.gz ./*
      
      # 5. Create GitHub Release and attach both artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ServiceStatusChecker-win-x64.zip
            ServiceStatusChecker-linux-x64.tar.gz
          generate_release_notes: true