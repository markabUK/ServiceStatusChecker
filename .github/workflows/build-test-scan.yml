name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential to see existing tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: get_version
        run: |
          VERSION=$(cat version.txt | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists. Skipping release job."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist. Release job will be queued."
          fi

      - name: Restore dependencies
        run: dotnet restore ServiceStatusChecker.slnx

      - name: Build
        # Passing the version from version.txt into the assembly metadata
        run: |
          dotnet build ServiceStatusChecker.slnx \
            --no-restore \
            --configuration Release \
            -p:Version=${{ steps.get_version.outputs.VERSION }} \
            -p:FileVersion=${{ steps.get_version.outputs.VERSION }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Test
        run: dotnet test ServiceStatusChecker.slnx --no-build --configuration Release

  release:
    needs: build
    # Only triggers the "Manual Approval" if we are on main AND the tag doesn't exist yet
    if: github.ref == 'refs/heads/main' && needs.build.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    environment: Release # Must match the environment name in Repo Settings -> Environments
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and Push Tag
        run: |
          VERSION=${{ needs.build.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v$VERSION
          git push origin v$VERSION
          echo "Successfully pushed tag v$VERSION"